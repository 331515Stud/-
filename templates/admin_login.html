<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход для массажиста</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #fdf2f6, #f9d8e6);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 80px 16px; color: #4a2b36;
  }
  .card {
    background: #fff; width: 100%; max-width: 360px;
    border-radius: 20px; box-shadow: 0 12px 40px rgba(214,120,165,.25);
    padding: 32px 24px;
  }
  h1 { font-size: 20px; margin-bottom: 20px; text-align: center; }
  input {
    width: 100%; padding: 13px 14px; font-size: 16px;
    border: 1.5px solid #efd3e0; border-radius: 12px;
    background: #fdf6f9; color: #4a2b36; outline: none; margin-bottom: 14px;
  }
  input:focus { border-color: #d47eab; box-shadow: 0 0 0 3px rgba(212,126,171,.18); background: #fff; }
  button {
    width: 100%; padding: 13px; font-size: 16px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, #e8a0bd, #d47eab); border: none; border-radius: 12px; cursor: pointer;
  }
  .flash { padding: 10px 12px; border-radius: 10px; font-size: 14px; margin-bottom: 14px; background: #fde8ec; color: #b03a50; }
</style>
</head>
<body>
  <div class="card">
    <h1>Вход для массажиста 🔑</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST" action="/admin">
      <input type="password" name="password" placeholder="Пароль" required>
      <button type="submit">Войти</button>
    </form>
  </div>
</body>
</html>
